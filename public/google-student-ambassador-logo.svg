<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
  <rect width="320" height="340" rx="24" fill="#050714"/>
  
  <defs>
    <linearGradient id="gsa-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="40%" stop-color="#34A853"/>
      <stop offset="75%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="gsa-grad-bottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <g transform="translate(160, 85)">
    <!-- Stylized Cap/Spark Top Diamond -->
    <path d="M 0 -55 C 22 -35 40 -18 58 0 C 40 18 22 35 0 55 C -22 35 -40 18 -58 0 C -40 -18 -22 -35 0 -55 Z" fill="none" stroke="url(#gsa-grad-top)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Inner Red Glow Accent -->
    <path d="M 0 35 L -16 20 L 0 5 L 16 20 Z" fill="#EA4335"/>

    <!-- Blue Lower Bracket/Collar -->
    <path d="M -48 15 L -48 52 L 0 85 L 48 52 L 48 15" fill="none" stroke="#4285F4" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Typography: Google Student Ambassador -->
  <text x="160" y="215" font-family="'Google Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    Google
  </text>
  <text x="160" y="260" font-family="'Google Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    Student
  </text>
  <text x="160" y="305" font-family="'Google Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    Ambassador
  </text>
</svg>
