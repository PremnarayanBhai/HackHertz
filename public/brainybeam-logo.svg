<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <!-- White rounded backdrop for clear rendering on dark backgrounds -->
  <rect x="0" y="0" width="500" height="160" rx="16" fill="#FFFFFF"/>
  
  <g transform="translate(18, 12)">
    <!-- Circuit Head Graphic -->
    <g transform="translate(0, 0)">
      <!-- Red Head Upper Profile -->
      <path d="M 50 12 C 30 12 14 28 14 48 C 14 55 16 62 20 68 L 105 68 C 105 50 95 32 82 22 C 73 15 62 12 50 12 Z" fill="#E61C24"/>
      
      <!-- Black Head Lower Profile / Face / Chin -->
      <path d="M 20 68 C 16 74 14 80 14 86 C 14 96 18 105 24 112 L 20 114 C 18 116 18 119 21 121 C 24 123 27 121 29 119 L 36 112 C 40 115 45 117 51 117 C 52 117 53 117 54 117 L 54 94 L 20 94 Z" fill="#E61C24"/>
      <path d="M 20 68 L 14 74 L 22 74 L 18 82 L 14 82 L 10 88 L 16 88 L 14 96 L 22 96 L 20 104 L 28 104 L 26 112 C 22 106 18 97 18 86 C 18 79 20 73 24 68 Z" fill="#050714"/>
      
      <!-- Head Front Face Cutout Silhouette -->
      <path d="M 16 48 C 16 32 30 18 48 18 C 65 18 78 28 84 42 L 68 42 C 64 36 56 30 48 30 C 37 30 28 39 28 50 C 28 56 31 61 35 65 L 18 65 C 16 60 16 54 16 48 Z" fill="#E61C24"/>
      
      <!-- Red Circuit Tracks -->
      <path d="M 68 38 L 105 38 L 105 18 L 120 18" stroke="#E61C24" stroke-width="4.5" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="120" y="10" width="16" height="16" fill="none" stroke="#E61C24" stroke-width="4.5"/>
      
      <path d="M 85 54 L 115 54" stroke="#E61C24" stroke-width="4.5" fill="none" stroke-linecap="square"/>
      <rect x="115" y="46" width="16" height="16" fill="none" stroke="#E61C24" stroke-width="4.5"/>
      
      <!-- Black Face & Horizontal Grid Lines -->
      <rect x="8" y="66" width="70" height="12" fill="#050714"/>
      <rect x="12" y="86" width="80" height="10" fill="#050714"/>
      
      <!-- Black Circuit Tracks -->
      <path d="M 70 82 L 108 82 L 125 98 L 145 98" stroke="#050714" stroke-width="4.5" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="145" y="90" width="16" height="16" fill="none" stroke="#050714" stroke-width="4.5"/>
      
      <path d="M 65 106 L 100 106 L 115 120 L 125 120" stroke="#050714" stroke-width="4.5" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="125" y="112" width="16" height="16" fill="none" stroke="#050714" stroke-width="4.5"/>
    </g>
    
    <!-- Typography Section -->
    <g transform="translate(170, 0)">
      <!-- Brainy (Red) & Beam (Black) -->
      <text x="0" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
        <tspan fill="#E61C24">Brainy</tspan>
        <tspan fill="#050714">Beam</tspan>
      </text>
      
      <!-- Info-Tech Pvt. Ltd. -->
      <text x="3" y="90" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="20.5" fill="#050714" letter-spacing="0.5">
        Info-Tech Pvt. Ltd.
      </text>
      
      <!-- "Better Brains for your Idea" Tagline -->
      <text x="3" y="122" font-family="'Comic Sans MS', 'Trebuchet MS', 'Segoe UI', cursive, sans-serif" font-weight="800" font-size="16.5" fill="#050714" letter-spacing="0.2">
        “Better Brains for your Idea”
      </text>
    </g>
  </g>
</svg>
