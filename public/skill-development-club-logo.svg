<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <rect width="360" height="220" rx="20" fill="#FFFFFF"/>
  
  <g transform="translate(24, 25)">
    <!-- Stylized Head Profile with Circuit Brain -->
    <g transform="translate(0, 0)">
      <!-- Head Contour -->
      <path d="M 68 18 C 34 18 10 42 10 76 C 10 92 16 106 24 116 C 26 120 26 130 24 145 C 22 158 20 162 20 162 C 30 160 42 152 48 145 C 56 148 64 150 72 150 C 78 150 82 144 82 136 C 82 128 78 124 74 124 C 68 124 66 120 70 114 C 76 104 88 98 88 88 C 88 80 84 76 80 72 C 86 64 88 54 88 44 C 88 30 80 18 68 18 Z" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Blue Circuit Brain Tracks & Nodes inside head -->
      <path d="M 38 120 L 38 72 L 52 54" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="52" cy="54" r="6" fill="none" stroke="#3B82F6" stroke-width="5"/>
      
      <path d="M 38 88 L 26 78" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="26" cy="74" r="6" fill="none" stroke="#3B82F6" stroke-width="5"/>
      
      <path d="M 48 116 L 48 85 L 64 74" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="74" r="6" fill="none" stroke="#3B82F6" stroke-width="5"/>
    </g>

    <!-- Typography: Skill Development Club -->
    <g transform="translate(112, 10)">
      <!-- Multicolor "Skill" -->
      <text x="0" y="58" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52">
        <tspan fill="#E11D48">S</tspan>
        <tspan fill="#F59E0B">k</tspan>
        <tspan fill="#3B82F6">i</tspan>
        <tspan fill="#3B82F6">l</tspan>
        <tspan fill="#3B82F6">l</tspan>
      </text>

      <!-- "Development" -->
      <text x="0" y="98" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#1E293B" letter-spacing="-0.5">
        Development
      </text>

      <!-- "Club" -->
      <text x="0" y="136" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#1E293B" letter-spacing="-0.5">
        Club
      </text>
    </g>
  </g>
</svg>
