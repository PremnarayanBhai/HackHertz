<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Lotus Outer Petal Gradient (Gold Tip to Pink Body) -->
    <linearGradient id="mainPetalFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="12%" stop-color="#fef08a" />
      <stop offset="28%" stop-color="#fbcfe8" />
      <stop offset="65%" stop-color="#f472b6" />
      <stop offset="90%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Intermediate (Back) Petal Gradient -->
    <linearGradient id="backPetalFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#f9a8d4" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <!-- Concentric Gold Ring Gradient -->
    <radialGradient id="goldBevelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="95%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <!-- Circular Banner Parchment Ring -->
    <radialGradient id="parchmentRing" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="82%" stop-color="#fef3c7" />
      <stop offset="95%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Globe Ocean Sphere Gradient -->
    <radialGradient id="globeOceanGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Globe Continent Gradient -->
    <linearGradient id="continentColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#a3e635" />
      <stop offset="65%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Om Symbol Gold Gradient -->
    <linearGradient id="omGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Tilak Gold Gradient -->
    <linearGradient id="tilakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Red Chandlo Radial Gradient -->
    <radialGradient id="chandloGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Text Curved Paths -->
    <!-- Top Arc Path: for "Shree Swaminarayan Institute Of Technology" -->
    <path id="topTextArc" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
    <!-- Bottom Arc Path: for "Gandhinagar" -->
    <path id="bottomTextArc" d="M 405 250 A 162 162 0 0 1 95 250" fill="none" />

    <!-- Outer Back Petal Template (Slightly shorter, rotated between main petals) -->
    <g id="backPetal">
      <path d="M 250 25 C 236 50, 224 88, 232 125 C 244 125, 256 125, 268 125 C 276 88, 264 50, 250 25 Z"
            fill="url(#backPetalFill)" stroke="#eab308" stroke-width="2.5" />
      <!-- Purple Radiating Lines inside back petal -->
      <line x1="250" y1="32" x2="250" y2="120" stroke="#701a75" stroke-width="1.8" />
      <line x1="244" y1="50" x2="240" y2="118" stroke="#86198f" stroke-width="1.4" />
      <line x1="256" y1="50" x2="260" y2="118" stroke="#86198f" stroke-width="1.4" />
      <line x1="238" y1="70" x2="234" y2="115" stroke="#a21caf" stroke-width="1.2" />
      <line x1="262" y1="70" x2="266" y2="115" stroke="#a21caf" stroke-width="1.2" />
    </g>

    <!-- Main Outer Lotus Petal Template -->
    <g id="mainPetal">
      <!-- Petal Body with Golden Tip -->
      <path d="M 250 12 C 232 45, 218 90, 226 132 C 242 132, 258 132, 274 132 C 282 90, 268 45, 250 12 Z"
            fill="url(#mainPetalFill)" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round" />
      <!-- Golden Tip highlight -->
      <path d="M 250 12 C 243 26, 238 42, 241 55 C 247 53, 253 53, 259 55 C 262 42, 257 26, 250 12 Z"
            fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Radiating Vertical Purple/Lilac Hatching Lines -->
      <line x1="250" y1="20" x2="250" y2="128" stroke="#581c87" stroke-width="2.2" />
      <line x1="244" y1="36" x2="239" y2="125" stroke="#701a75" stroke-width="1.8" />
      <line x1="256" y1="36" x2="261" y2="125" stroke="#701a75" stroke-width="1.8" />
      <line x1="238" y1="55" x2="232" y2="122" stroke="#86198f" stroke-width="1.5" />
      <line x1="262" y1="55" x2="268" y2="122" stroke="#86198f" stroke-width="1.5" />
      <line x1="232" y1="78" x2="228" y2="118" stroke="#a21caf" stroke-width="1.2" />
      <line x1="268" y1="78" x2="272" y2="118" stroke="#a21caf" stroke-width="1.2" />
    </g>
  </defs>

  <!-- 1. Background Intermediate Petals (16 Petals, shifted by 11.25 deg) -->
  <g>
    <use href="#backPetal" transform="rotate(11.25 250 250)" />
    <use href="#backPetal" transform="rotate(33.75 250 250)" />
    <use href="#backPetal" transform="rotate(56.25 250 250)" />
    <use href="#backPetal" transform="rotate(78.75 250 250)" />
    <use href="#backPetal" transform="rotate(101.25 250 250)" />
    <use href="#backPetal" transform="rotate(123.75 250 250)" />
    <use href="#backPetal" transform="rotate(146.25 250 250)" />
    <use href="#backPetal" transform="rotate(168.75 250 250)" />
    <use href="#backPetal" transform="rotate(191.25 250 250)" />
    <use href="#backPetal" transform="rotate(213.75 250 250)" />
    <use href="#backPetal" transform="rotate(236.25 250 250)" />
    <use href="#backPetal" transform="rotate(258.75 250 250)" />
    <use href="#backPetal" transform="rotate(281.25 250 250)" />
    <use href="#backPetal" transform="rotate(303.75 250 250)" />
    <use href="#backPetal" transform="rotate(326.25 250 250)" />
    <use href="#backPetal" transform="rotate(348.75 250 250)" />
  </g>

  <!-- 2. Foreground Main Petals (16 Petals) -->
  <g>
    <use href="#mainPetal" transform="rotate(0 250 250)" />
    <use href="#mainPetal" transform="rotate(22.5 250 250)" />
    <use href="#mainPetal" transform="rotate(45 250 250)" />
    <use href="#mainPetal" transform="rotate(67.5 250 250)" />
    <use href="#mainPetal" transform="rotate(90 250 250)" />
    <use href="#mainPetal" transform="rotate(112.5 250 250)" />
    <use href="#mainPetal" transform="rotate(135 250 250)" />
    <use href="#mainPetal" transform="rotate(157.5 250 250)" />
    <use href="#mainPetal" transform="rotate(180 250 250)" />
    <use href="#mainPetal" transform="rotate(202.5 250 250)" />
    <use href="#mainPetal" transform="rotate(225 250 250)" />
    <use href="#mainPetal" transform="rotate(247.5 250 250)" />
    <use href="#mainPetal" transform="rotate(270 250 250)" />
    <use href="#mainPetal" transform="rotate(292.5 250 250)" />
    <use href="#mainPetal" transform="rotate(315 250 250)" />
    <use href="#mainPetal" transform="rotate(337.5 250 250)" />
  </g>

  <!-- 3. Outer Concentric Golden Rims -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#ca8a04" stroke-width="4" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#fef08a" stroke-width="2.5" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#854d0e" stroke-width="1.5" />

  <!-- 4. Parchment Beige Circular Name Ring -->
  <circle cx="250" cy="250" r="210" fill="url(#parchmentRing)" stroke="#78350f" stroke-width="2" />

  <!-- 5. Inner Concentric Ring Dividing Text & Globe -->
  <circle cx="250" cy="250" r="144" fill="none" stroke="#78350f" stroke-width="2.5" />
  <circle cx="250" cy="250" r="141" fill="none" stroke="#fde047" stroke-width="3" />
  <circle cx="250" cy="250" r="138" fill="none" stroke="#1e3a8a" stroke-width="2" />

  <!-- 6. Arched Institute Name Text (Accurate Font & Maroon Typography) -->
  <g font-family="'Trebuchet MS', 'Arial Black', 'Arial', sans-serif" font-weight="900" fill="#780016" stroke="#450a0a" stroke-width="0.7">
    <!-- Top Arc: Shree Swaminarayan Institute Of Technology -->
    <text font-size="20.8" letter-spacing="1.1px">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        Shree Swaminarayan Institute Of Technology
      </textPath>
    </text>

    <!-- Bottom Arc: Gandhinagar -->
    <text font-size="22" letter-spacing="3.8px">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        Gandhinagar
      </textPath>
    </text>
  </g>

  <!-- Decorative Maroon Dots at 9 o'clock and 3 o'clock -->
  <g fill="#780016" stroke="#450a0a" stroke-width="0.8">
    <circle cx="95" cy="250" r="4.5" />
    <circle cx="405" cy="250" r="4.5" />
  </g>

  <!-- 7. Central Globe (Ocean & Continents) -->
  <g id="centralGlobe">
    <clipPath id="globeClip">
      <circle cx="250" cy="250" r="136" />
    </clipPath>

    <!-- Ocean Base with Sphere Shading -->
    <circle cx="250" cy="250" r="136" fill="url(#globeOceanGrad)" />

    <!-- Latitudinal & Longitudinal Grid Lines -->
    <g clip-path="url(#globeClip)" stroke="#93c5fd" stroke-width="1.1" opacity="0.32" fill="none">
      <ellipse cx="250" cy="250" rx="136" ry="42" />
      <ellipse cx="250" cy="250" rx="136" ry="88" />
      <ellipse cx="250" cy="250" rx="42" ry="136" />
      <ellipse cx="250" cy="250" rx="88" ry="136" />
      <line x1="114" y1="250" x2="386" y2="250" />
      <line x1="250" y1="114" x2="250" y2="386" />
    </g>

    <!-- Continents Layer with Vibrant Green-Gold Gradients -->
    <g clip-path="url(#globeClip)" fill="url(#continentColor)" stroke="#14532d" stroke-width="1.8" stroke-linejoin="round">
      <!-- Africa continent -->
      <path d="M 175 228 C 185 218, 212 216, 222 238 C 234 254, 230 282, 220 312 C 215 332, 204 354, 192 368 C 182 368, 178 352, 176 332 C 166 312, 150 286, 156 264 C 162 244, 170 234, 175 228 Z" />
      
      <!-- Europe & Northern/Central Asia -->
      <path d="M 170 158 C 185 142, 228 138, 270 142 C 312 148, 355 162, 370 188 C 380 208, 365 228, 342 234 C 312 238, 290 224, 268 214 C 242 204, 218 204, 192 188 C 176 178, 166 168, 170 158 Z" />
      
      <!-- Indian Subcontinent (Prominently Rendered) -->
      <path d="M 272 212 C 282 212, 304 222, 314 242 C 322 258, 312 284, 302 300 C 290 292, 284 272, 278 252 C 272 236, 268 222, 272 212 Z" />
      
      <!-- East Asia / China / Japan -->
      <path d="M 330 228 C 352 228, 378 244, 382 264 C 382 284, 362 298, 346 308 C 336 298, 336 274, 330 252 Z" />

      <!-- Australia / Southeast Asian Islands -->
      <ellipse cx="342" cy="336" rx="24" ry="15" />
      <ellipse cx="310" cy="326" rx="10" ry="5" />
      <circle cx="360" cy="290" r="5" />
    </g>

    <!-- 8. Tilak Chandlo Emblem placed over Gujarat / India -->
    <g transform="translate(290, 232) scale(1.05)">
      <!-- Golden/Saffron U-Shaped Tilak -->
      <path d="M 4 0 L 4 23 C 4 30, 10 36, 18 36 C 26 36, 32 30, 32 23 L 32 0 L 26 0 L 26 21 C 26 25, 23 29, 18 29 C 13 29, 10 25, 10 21 L 10 0 Z" 
            fill="url(#tilakGrad)" stroke="#78350f" stroke-width="1.4" />
      <!-- Crimson Red Chandlo (Round Bindi) -->
      <circle cx="18" cy="16" r="6.8" fill="url(#chandloGrad)" stroke="#450a0a" stroke-width="1.2" />
      <!-- Tiny White Light Reflection on Chandlo -->
      <circle cx="15.8" cy="13.8" r="2" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- 9. Auspicious Golden 3D ૐ (Aum/Om) Symbol at Top of Globe -->
    <g transform="translate(222, 126) scale(1.25)">
      <!-- Drop Shadow for 3D depth -->
      <path d="M 13 19 C 11 13, 17 7, 25 7 C 32 7, 37 12, 36 18 C 35 23, 30 26, 25 28 C 31 29, 39 34, 38 43 C 37 50, 29 55, 19 54 C 11 53, 7 46, 8 39 C 8 35, 11 33, 14 34 C 17 35, 18 39, 17 42 C 16 45, 19 48, 24 48 C 29 48, 32 44, 32 39 C 32 33, 26 30, 19 30 C 16 30, 14 28, 15 25 C 16 22, 19 22, 22 22 C 27 22, 30 19, 30 15 C 30 11, 27 9, 23 9 C 18 9, 15 13, 16 16 C 17 18, 15 20, 13 19 Z" 
            fill="#0f172a" opacity="0.45" transform="translate(1.5, 1.5)" />
      
      <!-- Main Golden Om Body -->
      <path d="M 13 19 C 11 13, 17 7, 25 7 C 32 7, 37 12, 36 18 C 35 23, 30 26, 25 28 C 31 29, 39 34, 38 43 C 37 50, 29 55, 19 54 C 11 53, 7 46, 8 39 C 8 35, 11 33, 14 34 C 17 35, 18 39, 17 42 C 16 45, 19 48, 24 48 C 29 48, 32 44, 32 39 C 32 33, 26 30, 19 30 C 16 30, 14 28, 15 25 C 16 22, 19 22, 22 22 C 27 22, 30 19, 30 15 C 30 11, 27 9, 23 9 C 18 9, 15 13, 16 16 C 17 18, 15 20, 13 19 Z" 
            fill="url(#omGoldGrad)" stroke="#854d0e" stroke-width="1.6" />
      
      <!-- Crescent & Bindi on Om -->
      <path d="M 34 13 C 38 13, 43 17, 45 23 C 42 19, 37 18, 33 19 C 31 19, 31 16, 34 13 Z" 
            fill="url(#omGoldGrad)" stroke="#854d0e" stroke-width="1.2" />
      <circle cx="43" cy="11" r="3.2" fill="url(#omGoldGrad)" stroke="#854d0e" stroke-width="1" />
      <circle cx="42" cy="10" r="1.2" fill="#ffffff" />
    </g>
  </g>
</svg>
