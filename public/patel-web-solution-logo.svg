<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <!-- Clean white backdrop for crisp high contrast rendering -->
  <rect x="0" y="0" width="500" height="480" rx="20" fill="#FFFFFF"/>
  
  <g transform="translate(60, 20)">
    <!-- Main Icon: Rounded Square Emblem -->
    <!-- Registered Trademark symbol -->
    <text x="362" y="42" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="bold" fill="#202238">®</text>

    <!-- Green Shadow/Offset Rounded Rectangle Layer -->
    <rect x="28" y="16" width="310" height="310" rx="55" fill="#48BB78"/>
    
    <!-- Purple Top Rounded Rectangle Layer -->
    <rect x="42" y="24" width="298" height="298" rx="50" fill="#6766A6"/>

    <!-- Slanted Green accent underlying 'p' loop -->
    <path d="M 172 100 C 235 90 270 135 255 210 C 240 270 190 285 135 270 Z" fill="#48BB78"/>

    <!-- White 'p' glyph stylized italic form -->
    <!-- 'p' stem -->
    <path d="M 180 88 C 172 88 152 94 140 102 L 68 322 L 108 322 L 142 225 C 160 255 205 272 250 250 C 290 228 312 180 300 135 C 288 95 240 88 180 88 Z M 190 126 C 232 126 256 150 250 185 C 244 220 216 238 182 238 C 162 238 150 228 145 212 L 175 128 C 180 127 185 126 190 126 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography Area -->
  <g transform="translate(250, 395)" text-anchor="middle">
    <!-- PATEL WEB SOLUTION -->
    <text y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="3">
      <tspan fill="#008F4C">PATEL </tspan>
      <tspan fill="#6766A6">WEB SOLUTION</tspan>
    </text>

    <!-- Thin Divider Line -->
    <line x1="-200" y1="18" x2="200" y2="18" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- We believe in quality -->
    <text y="54" font-family="'Segoe UI Light', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="#475569" letter-spacing="1.5">
      We believe in quality
    </text>
  </g>
</svg>
